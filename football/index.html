  <title>football — shreyas venadan</title>
  <!-- Arriving by a kick from the island (src/lib/kick.ts), the page opens
       covered by the ball that flew into the screen. -->
  <script>
    try {
      var at = Number(sessionStorage.getItem('kick-off'))
      sessionStorage.removeItem('kick-off')
      if (at && Date.now() - at < 8000) document.documentElement.dataset.ball = ''
    } catch (e) {}
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/football.tsx"></script>
</body>
