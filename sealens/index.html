<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1f7497" />
  <meta name="description" content="SeaLens: a macOS and web app that uses machine learning to find, track and count fish in underwater reef video. Co-founded by shreyas venadan." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400..700;1,400..700&display=swap"
    rel="stylesheet" />
  <title>sealens — shreyas venadan</title>
  <!-- Arriving by SeaLens lock-on (src/lib/lockOn.ts), the page opens in its
       viewfinder. -->
  <script>
    function lockIn() {
      try {
        var lock = JSON.parse(sessionStorage.getItem('lock-on') || 'null')
        sessionStorage.removeItem('lock-on')
        if (lock && Date.now() - lock.at < 8000) document.documentElement.dataset.lock = lock.name
      } catch (e) {}
    }
    // Built ahead of time (index.html's speculation rules), check once it's shown.
    if (document.prerendering) document.addEventListener('prerenderingchange', lockIn, { once: true })
    else lockIn()
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/sealens.tsx"></script>
</body>

</html>
